name: Build Reynard Enhanced

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release with the IPA'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Checkout Firefox submodule
        run: git submodule update --init --depth 1 --recursive engine/firefox

      - name: Checkout idevice submodule
        run: git submodule update --init --depth 1 --recursive support/idevice

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Rust iOS target
        run: |
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Update Gecko
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Apply Enhanced mobile.js
        run: |
          MOBILE_JS="engine/firefox/mobile/ios/app/defaults/pref/mobile.js"
          if [ ! -f "$MOBILE_JS" ]; then
            MOBILE_JS=$(find engine/firefox -path "*/defaults/pref/mobile.js" -print -quit 2>/dev/null || true)
          fi
          if [ -n "$MOBILE_JS" ] && [ -f "$MOBILE_JS" ]; then
            cat enhancements/mobile-enhanced.js >> "$MOBILE_JS"
            echo "Enhanced prefs appended to $MOBILE_JS"
          else
            echo "WARNING: mobile.js not found, skipping pref enhancements"
          fi

      - name: Build idevice
        run: ./tools/development/build-idevice.sh

      - name: Build the app
        run: |
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ./tools/release/build-app.sh

      - name: Create .ipa file
        run: ./tools/release/create-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Enhanced.ipa
          path: ./dist/Reynard.ipa

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Reynard-Enhanced.ipa
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: enhanced-${{ github.run_number }}
          name: "Reynard Enhanced Build #${{ github.run_number }}"
          body: |
            Reynard Browser Enhanced Edition
            - GC tuning & memory optimizations
            - Network improvements
            - Font rendering fixes
            - Scroll glitch reduction
            - Privacy hardening
            - Icon rendering stability
          files: ./dist/Reynard.ipa
          draft: false
          prerelease: false
