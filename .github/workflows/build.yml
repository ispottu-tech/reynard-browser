name: Build Reynard Enhanced

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select latest Xcode and show SDK info
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "No Xcode found"

          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi

          echo "=== Xcode version ==="
          xcodebuild -version

          echo "=== SDK versions ==="
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun --sdk macosx --show-sdk-version || true

          echo "=== Clang version ==="
          clang --version || true

      - name: Install LLVM linker (lld)
        run: |
          brew install llvm
          CLANG_DIR=$(dirname $(xcrun -f clang))
          echo "Clang directory: $CLANG_DIR"
          sudo ln -sf /opt/homebrew/opt/llvm/bin/ld64.lld "$CLANG_DIR/ld64.lld"
          sudo ln -sf /opt/homebrew/opt/llvm/bin/ld.lld "$CLANG_DIR/ld.lld"
          sudo ln -sf /opt/homebrew/opt/llvm/bin/lld "$CLANG_DIR/lld"
          sudo ln -sf /opt/homebrew/opt/llvm/bin/wasm-ld "$CLANG_DIR/wasm-ld"
          echo "lld symlinked into Xcode toolchain at $CLANG_DIR"
          ls -la "$CLANG_DIR/ld64.lld"
          "$CLANG_DIR/ld64.lld" --version || true

      - name: Install Rust toolchain
        run: |
          rustup target add aarch64-apple-ios
          rustup component add rust-src
          rustc --version

      - name: Initialize Gecko engine (Firefox submodule)
        run: ./tools/development/update-gecko.sh

      - name: Fix apply-patches for CI (remove interactive read)
        run: |
          sed -i '' 's/read -r response/response="y"/' tools/development/apply-patches.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Bypass SDK version check if needed
        run: |
          cd engine/firefox
          echo "Searching for SDK version checks..."
          FOUND=$(grep -rl "is too old" build/moz.configure/ python/ moz.configure 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "Found SDK checks in: $FOUND"
            for f in $FOUND; do
              echo "--- Patching $f ---"
              sed -i '' 's/die(".*is too old.*/# SDK check bypassed by Reynard Enhanced build/' "$f" 2>/dev/null || true
              sed -i '' 's/configure_error(".*is too old.*/# SDK check bypassed by Reynard Enhanced build/' "$f" 2>/dev/null || true
            done
          else
            echo "No SDK version checks found to patch"
          fi

      - name: Apply Enhanced preferences
        run: |
          APPLIED=false

          MOBILE_JS=$(find engine/firefox/mobile -name "mobile.js" -type f -print -quit 2>/dev/null || true)
          if [ -n "$MOBILE_JS" ] && [ -f "$MOBILE_JS" ]; then
            cat enhancements/mobile-enhanced.js >> "$MOBILE_JS"
            echo "Enhanced prefs appended to $MOBILE_JS"
            APPLIED=true
          else
            echo "mobile.js not found in engine/firefox/mobile/"
          fi

          ALL_JS="engine/firefox/modules/libpref/init/all.js"
          if [ -f "$ALL_JS" ]; then
            cat enhancements/mobile-enhanced.js >> "$ALL_JS"
            echo "Enhanced prefs also appended to $ALL_JS"
            APPLIED=true
          else
            echo "all.js not found at $ALL_JS"
          fi

          if [ "$APPLIED" = false ]; then
            echo "ERROR: Could not find any preferences file to append to"
            echo "Searching for all .js pref files..."
            find engine/firefox -name "mobile.js" -type f 2>/dev/null || true
            find engine/firefox -path "*/libpref/init/*.js" -type f 2>/dev/null || true
            exit 1
          fi

      - name: Add JavaScript alert/confirm/prompt support
        run: |
          CONTENT_DELEGATE="browser/GeckoView/ContentDelegate.swift"
          GECKO_SESSION="browser/GeckoView/GeckoSession.swift"

          sed -i '' '/^import Foundation$/a\
          import UIKit' "$CONTENT_DELEGATE"

          cat enhancements/prompt-handler-append.swift >> "$CONTENT_DELEGATE"
          echo "Prompt handler appended to ContentDelegate.swift"

          sed -i '' '/lazy var progressHandler = newProgressHandler(self)/a\
          lazy var promptHandler = newPromptHandler(self)' "$GECKO_SESSION"

          sed -i '' 's/        progressHandler,/        progressHandler,\
                  promptHandler,/' "$GECKO_SESSION"

          echo "promptHandler registered in GeckoSession.swift"

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Patch linker detection for Apple toolchain
        run: |
          cd engine/firefox
          echo "=== Searching for linker check code ==="
          LINKER_FILES=$(grep -rl "Could not use.*linker\|Could not use.*as linker" build/moz.configure/ python/ moz.configure 2>/dev/null || true)
          echo "Files with linker check: $LINKER_FILES"

          if [ -n "$LINKER_FILES" ]; then
            for f in $LINKER_FILES; do
              echo "--- Patching $f ---"
              grep -n "Could not use" "$f" | head -5
              sed -i '' 's/die(.*Could not use.*linker.*/pass  # linker check bypassed/' "$f" 2>/dev/null || true
              sed -i '' 's/configure_error(.*Could not use.*linker.*/pass  # linker check bypassed/' "$f" 2>/dev/null || true
            done
          fi

          LINKER_FILES2=$(grep -rl "adequate linker\|Failed.*linker" build/moz.configure/ python/ moz.configure 2>/dev/null || true)
          echo "Files with adequate linker check: $LINKER_FILES2"

          if [ -n "$LINKER_FILES2" ]; then
            for f in $LINKER_FILES2; do
              echo "--- Patching $f ---"
              grep -n "adequate\|Failed.*linker" "$f" | head -5
              sed -i '' 's/die(.*adequate linker.*/pass  # linker check bypassed/' "$f" 2>/dev/null || true
              sed -i '' 's/configure_error(.*adequate linker.*/pass  # linker check bypassed/' "$f" 2>/dev/null || true
              sed -i '' 's/die(.*Failed.*linker.*/pass  # linker check bypassed/' "$f" 2>/dev/null || true
            done
          fi

      - name: Build Gecko engine
        run: |
          FIREFOX_DIR="$(pwd)/engine/firefox"

          rm -f "$FIREFOX_DIR/.mozconfig"
          cat > "$FIREFOX_DIR/.mozconfig" << 'MOZEOF'
          export CC="/opt/homebrew/opt/llvm/bin/clang"
          export CXX="/opt/homebrew/opt/llvm/bin/clang++"
          ac_add_options --enable-application=mobile/ios
          ac_add_options --target=aarch64-apple-ios
          ac_add_options --enable-ios-target=14.0
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --enable-linker=lld
          MOZEOF

          echo "=== .mozconfig ==="
          cat "$FIREFOX_DIR/.mozconfig"

          cd "$FIREFOX_DIR"
          ./mach build

      - name: Build Reynard app
        run: |
          xcodebuild build \
            -project browser/ArtI.xcodeproj \
            -scheme ArtI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Create IPA
        run: |
          APP_PATH=$(find build/derived -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find build/derived -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP_PATH"

          mkdir -p export/Payload
          cp -r "$APP_PATH" export/Payload/
          cd export
          zip -r ../Reynard-Enhanced.ipa Payload
          cd ..
          ls -lh Reynard-Enhanced.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Enhanced-IPA
          path: Reynard-Enhanced.ipa

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Reynard-Enhanced-IPA

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-enhanced-${{ github.run_number }}
          name: Reynard Enhanced Build ${{ github.run_number }}
          body: |
            Reynard Browser - Enhanced Edition
            Built from source with GitHub Actions

            Enhancements:
            - JIT compilation enabled (requires pairing file)
            - WebAssembly support enabled
            - GPU acceleration and WebRender enabled
            - 80+ performance and stability optimizations
            - JavaScript alert/confirm/prompt support
            - Popup auto-allow and beforeUnload handling

            Install via TrollStore on jailbroken iOS 14+ device.
          files: Reynard-Enhanced.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
