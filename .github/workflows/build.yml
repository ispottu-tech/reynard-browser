name: Build Reynard Enhanced

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select latest Xcode and show SDK info
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Fix linker for Firefox configure
        run: |
          REAL_LD=$(xcrun -f ld)
          echo "Real ld at: $REAL_LD"
          sudo cp "$REAL_LD" "${REAL_LD}.real"
          sudo tee "$REAL_LD" > /dev/null << 'WRAPPER'
          #!/bin/bash
          for arg in "$@"; do
            if [ "$arg" = "--version" ]; then
              echo "Apple ld64 1077.12"
              exit 0
            fi
          done
          exec "${0}.real" "$@"
          WRAPPER
          sudo chmod +x "$REAL_LD"
          echo "ld wrapper installed"
          xcrun ld --version

      - name: Install Rust toolchain
        run: |
          rustup target add aarch64-apple-ios
          rustup component add rust-src
          cargo install cbindgen
          rustc --version
          cbindgen --version

      - name: Initialize Gecko engine (Firefox submodule)
        run: ./tools/development/update-gecko.sh

      - name: Fix apply-patches for CI (remove interactive read)
        run: |
          sed -i '' 's/read -r response/response="y"/' tools/development/apply-patches.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Apply Enhanced preferences
        run: |
          APPLIED=false

          MOBILE_JS=$(find engine/firefox/mobile -name "mobile.js" -type f -print -quit 2>/dev/null || true)
          if [ -n "$MOBILE_JS" ] && [ -f "$MOBILE_JS" ]; then
            cat enhancements/mobile-enhanced.js >> "$MOBILE_JS"
            echo "Enhanced prefs appended to $MOBILE_JS"
            APPLIED=true
          else
            echo "mobile.js not found in engine/firefox/mobile/"
          fi

          ALL_JS="engine/firefox/modules/libpref/init/all.js"
          if [ -f "$ALL_JS" ]; then
            cat enhancements/mobile-enhanced.js >> "$ALL_JS"
            echo "Enhanced prefs also appended to $ALL_JS"
            APPLIED=true
          else
            echo "all.js not found at $ALL_JS"
          fi

          if [ "$APPLIED" = false ]; then
            echo "ERROR: Could not find any preferences file to append to"
            find engine/firefox -name "mobile.js" -type f 2>/dev/null || true
            find engine/firefox -path "*/libpref/init/*.js" -type f 2>/dev/null || true
            exit 1
          fi

      - name: Add JavaScript alert/confirm/prompt support
        run: |
          CONTENT_DELEGATE="browser/GeckoView/ContentDelegate.swift"
          GECKO_SESSION="browser/GeckoView/GeckoSession.swift"

          sed -i '' '/^import Foundation$/a\
          import UIKit' "$CONTENT_DELEGATE"

          cat enhancements/prompt-handler-append.swift >> "$CONTENT_DELEGATE"
          echo "Prompt handler appended to ContentDelegate.swift"

          sed -i '' '/lazy var progressHandler = newProgressHandler(self)/a\
          lazy var promptHandler = newPromptHandler(self)' "$GECKO_SESSION"

          sed -i '' 's/        progressHandler,/        progressHandler,\
                  promptHandler,/' "$GECKO_SESSION"

          echo "promptHandler registered in GeckoSession.swift"

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko engine
        run: |
          ./tools/development/build-gecko.sh || true

          echo 'ac_add_options --without-wasm-sandboxed-libraries' >> engine/firefox/.mozconfig
          echo "=== Final .mozconfig ==="
          cat engine/firefox/.mozconfig

          cd engine/firefox
          ./mach build

      - name: Build Reynard app
        run: |
          xcodebuild build \
            -project browser/ArtI.xcodeproj \
            -scheme ArtI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Create IPA
        run: |
          APP_PATH=$(find build/derived -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            find build/derived -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP_PATH"

          mkdir -p export/Payload
          cp -r "$APP_PATH" export/Payload/
          cd export
          zip -r ../Reynard-Enhanced.ipa Payload
          cd ..
          ls -lh Reynard-Enhanced.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Enhanced-IPA
          path: Reynard-Enhanced.ipa

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Reynard-Enhanced-IPA

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-enhanced-${{ github.run_number }}
          name: Reynard Enhanced Build ${{ github.run_number }}
          body: |
            Reynard Browser - Enhanced Edition
            Built from source with GitHub Actions

            Enhancements:
            - JIT compilation enabled (requires pairing file)
            - WebAssembly support enabled
            - GPU acceleration and WebRender enabled
            - 80+ performance and stability optimizations
            - JavaScript alert/confirm/prompt support
            - Popup auto-allow and beforeUnload handling

            Install via TrollStore on jailbroken iOS 14+ device.
          files: Reynard-Enhanced.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
